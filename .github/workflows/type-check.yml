name: Check source type baseline

on:
  push:
    branches: [main, develop, develop-next]
  pull_request:
    branches: [main, develop, develop-next]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: source-type-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Reject type regressions and stale baseline entries
        run: uv run --no-sync python scripts/check-types.py
